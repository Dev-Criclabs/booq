<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Cormorant+Garamond:wght@500&amp;family=Noto+Sans+Thai:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--g:#F1F3EC;--cd:#FFFFFF;--ink:#1D241F;--hd:#24392B;--mu:#58635B;--ln:rgba(29,36,31,.12);--dk:#4E6B54;--od:#FFFFFF;--odm:rgba(255,255,255,.88);--ac:#F3D98E;--oac:#24392B;--sel:#3F5E46;--tn:#DDEADB;--tni:#3F5E46;--sh:rgba(36,57,43,.08); width: 375px; height: 812px; box-sizing: border-box; background: var(--g); font-family: 'DM Sans', ui-sans-serif, system-ui, 'Noto Sans Thai', sans-serif; color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 16px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; flex: none; border-radius: 50%; background: #6E8B72; border: 3px solid var(--cd); box-shadow: 0 2px 10px var(--sh)"></span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em; color: var(--hd)">Hi, ploy.s</span><span style="font-size: 14px; color: var(--mu)">Two details to finish your booking</span></div></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px; overflow: hidden">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--mu)">Full name<input type="text" value="Ploy Srisuk" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid var(--cd); border-radius: 14px; background: var(--cd); font-family: inherit; font-size: 16px; color: var(--ink)"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--mu)">Phone number<input type="tel" value="081 234 5678" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid var(--sel); border-radius: 14px; background: var(--cd); font-family: inherit; font-size: 16px; color: var(--ink)"></label>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 13px; line-height: 1.5; color: var(--mu)"><input type="checkbox" checked style="width: 20px; height: 20px; flex: none; margin: 0; accent-color: #3F5E46">I agree to the terms and the privacy notice (PDPA).</label>
<span style="padding: 12px 14px; border-radius: 14px; background: var(--cd); font-size: 13px; line-height: 1.5; color: var(--mu)">Student prices ask for your date of birth. You can add your playing level later in Profile.</span>
</div>
<div style="flex: none; padding: 14px 20px 26px"><button style="width: 100%; height: 54px; border: 0; border-radius: 999px; background: var(--hd); color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">Continue to payment</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
