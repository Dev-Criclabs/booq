name: CI

# Monorepo CI (build plan sections 2 and 4). Runs on every pull request and on pushes to main.
#
# Runs now, on the F01-T01 scaffold:
#   lint, typecheck, test (UTC and Asia/Bangkok), locale audit, hard-coded text lint,
#   locale tool self tests, wording guard (pull requests only).
# Runs when the file or script exists (a placeholder until then):
#   table classes, audit triggers, migration numbers, generated types are current,
#   database tests on the Supabase local stack.
#
# A placeholder that is missing is a notice. Set the repository variable CI_STRICT=true
# (Settings, Variables) once F01-T05 and F01-T36 land, and a missing one fails the build.
# CI uses no secrets. Tests use the fakes under tests/fakes (fake Beam, fake LINE) and no network.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_STRICT: ${{ vars.CI_STRICT }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint,                   cmd: "pnpm run lint" }
          - { name: typecheck,              cmd: "pnpm run typecheck" }
          # Servers run in UTC. App code converts through packages/time, so the suite
          # must pass under both zones (build plan section 3, change 3).
          - { name: test (UTC),             cmd: "pnpm run test", tz: UTC }
          - { name: test (Asia/Bangkok),    cmd: "pnpm run test", tz: Asia/Bangkok }
          - { name: locale audit,           cmd: "node tools/i18n/audit.mjs --no-csv" }
          - { name: hard-coded text,        cmd: "node tools/i18n/lint-hardcoded-text.mjs apps packages" }
          - { name: locale tool tests,      cmd: "node --test tools/i18n/test/*.test.mjs", ts_from: "." }
    env:
      TZ: ${{ matrix.tz || 'UTC' }}
      I18N_TS_FROM: ${{ matrix.ts_from }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # TEXT-04: wording of an existing key never changes in a feature pull request.
  # The writers' refined files replace it later: give that pull request the label "wording-update".
  wording:
    name: wording guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'wording-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/i18n/check-wording.mjs "origin/${{ github.base_ref }}"

  # Repository rules that need a script from another role. Each runs the script if it exists.
  #   tools/check-table-classes.mjs     every table is in packages/db table classes; S tables hold no personal columns (F01-T05)
  #   tools/check-audit-triggers.mjs    every audited table has its trigger (F01-T36)
  #   tools/check-migrations.mjs        no duplicate or out-of-order migration numbers (build plan section 4)
  # Names are a contract with the Architect. Rename here if they pick others.
  rules:
    name: repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in step with the workspace
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then echo "pnpm-lock.yaml is unchanged by install."
          else
            git --no-pager diff --stat -- pnpm-lock.yaml
            echo "::warning::pnpm install changed pnpm-lock.yaml. Run pnpm install and commit the lockfile (F01-T01 owner)."
            [ "${CI_STRICT:-}" = "true" ] && { echo "::error::Lockfile drift and CI_STRICT is true."; exit 1; }
          fi
          exit 0
      - name: Table classes, audit triggers, migration numbers
        run: |
          rc=0
          for s in check-table-classes check-audit-triggers check-migrations; do
            f="tools/$s.mjs"
            if [ -f "$f" ]; then
              echo "== $f"; node "$f" || rc=1
            elif [ "${CI_STRICT:-}" = "true" ]; then
              echo "::error::$f is missing and CI_STRICT is true."; rc=1
            else
              echo "::notice::$f does not exist yet. Skipped."
            fi
          done
          exit $rc

  # Database tests on the Supabase local stack. Needs the Supabase project folder (config.toml),
  # which the Architect adds with F01-T03. Looks in ./supabase and ./packages/db/supabase.
  # Script contract in the root package.json:
  #   test:db    runs the database suites (RLS, no-double-booking, tenant). Reads DATABASE_URL and SUPABASE_* from the environment
  #   db:types   regenerates the generated database types in place
  db:
    name: database tests and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          dir=""
          for d in . packages/db; do [ -f "$d/supabase/config.toml" ] && dir="$d" && break; done
          if [ -n "$dir" ]; then echo "dir=$dir" >> "$GITHUB_OUTPUT"
          elif [ "${CI_STRICT:-}" = "true" ]; then echo "::error::No supabase/config.toml and CI_STRICT is true."; exit 1
          else echo "::notice::No supabase/config.toml yet. Database tests skipped."; fi
      - if: steps.find.outputs.dir
        uses: pnpm/action-setup@v4
      - if: steps.find.outputs.dir
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.find.outputs.dir
        run: pnpm install --frozen-lockfile
      - if: steps.find.outputs.dir
        uses: supabase/setup-cli@v1
        with:
          version: latest      # pin to the version the Architect develops with once chosen
      - name: Start the local stack (applies every migration from scratch)
        if: steps.find.outputs.dir
        run: supabase start --workdir "${{ steps.find.outputs.dir }}"
      - name: Database tests
        if: steps.find.outputs.dir
        env:
          TZ: UTC
        run: |
          eval "$(supabase status --workdir "${{ steps.find.outputs.dir }}" -o env | sed 's/^/export /')"
          export DATABASE_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          if node -e "process.exit(require('./package.json').scripts?.['test:db'] ? 0 : 1)"; then pnpm run test:db
          elif [ "${CI_STRICT:-}" = "true" ]; then echo "::error::No test:db script and CI_STRICT is true."; exit 1
          else echo "::notice::No test:db script yet."; fi
      - name: Generated types are current
        if: steps.find.outputs.dir
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['db:types'] ? 0 : 1)"; then
            pnpm run db:types
            git --no-pager diff --exit-code -- . ':!pnpm-lock.yaml' \
              || { echo "::error::Generated database types are out of date. Run pnpm run db:types and commit."; exit 1; }
          elif [ "${CI_STRICT:-}" = "true" ]; then echo "::error::No db:types script and CI_STRICT is true."; exit 1
          else echo "::notice::No db:types script yet."; fi
      - name: Stop the stack
        if: always() && steps.find.outputs.dir
        run: supabase stop --workdir "${{ steps.find.outputs.dir }}" --no-backup

  # One status to require in branch protection.
  ci-ok:
    name: CI result
    if: always()
    needs: [checks, wording, rules, db]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "checks=${{ needs.checks.result }} wording=${{ needs.wording.result }} rules=${{ needs.rules.result }} db=${{ needs.db.result }}"
          case "${{ needs.checks.result }} ${{ needs.wording.result }} ${{ needs.rules.result }} ${{ needs.db.result }}" in
            *failure*|*cancelled*) exit 1 ;;
          esac
